<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>system</type>
  <!-- Every trusted client is root in this single-purpose hardware container. -->
  <user>root</user>
  <listen>unix:path=/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>

  <!--
    No servicedir or standard_system_servicedirs entry is intentional.
    This private bus never performs D-Bus service activation.
  -->

  <policy context="default">
    <deny user="*"/>
    <allow user="root"/>

    <deny own="*"/>
    <deny send_type="method_call"/>

    <allow send_type="signal"/>
    <allow send_requested_reply="true" send_type="method_return"/>
    <allow send_requested_reply="true" send_type="error"/>

    <allow receive_type="method_call"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
    <allow receive_type="signal"/>

    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus"/>
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.freedesktop.DBus"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

  <!-- D-Bus, ModemManager, the owner, and the Agent are container-local. -->
  <policy user="root">
    <allow own="org.freedesktop.ModemManager1"/>

    <allow send_destination="org.freedesktop.ModemManager1"
           send_type="method_call"/>
  </policy>

  <limit name="max_incoming_bytes">8388608</limit>
  <limit name="max_outgoing_bytes">8388608</limit>
  <limit name="max_message_size">1048576</limit>
  <limit name="max_completed_connections">32</limit>
  <limit name="max_incomplete_connections">8</limit>
</busconfig>
