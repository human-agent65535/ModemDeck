name: modemdeck

services:
  hardware:
    build:
      context: .
      dockerfile: hardware/Dockerfile
      target: runtime
      args:
        VERSION: ${MODEMDECK_HARDWARE_VERSION:-dev}
        BUILD_DATE: ${MODEMDECK_BUILD_DATE:-unknown}
        VCS_REF: ${MODEMDECK_VCS_REF:-unknown}
    image: ${MODEMDECK_HARDWARE_IMAGE:-modemdeck-hardware}:${MODEMDECK_HARDWARE_VERSION:-dev}
    container_name: modemdeck-hardware
    restart: unless-stopped
    network_mode: host
    privileged: true
    read_only: true
    environment:
      MODEMDECK_HARDWARE_MODE: simple
      MODEMDECK_AGENT_SOCKET: /run/modemdeck/agent.sock
      MODEMDECK_AGENT_SOCKET_MODE: "0660"
      MODEMDECK_AGENT_SOCKET_GID: ${MODEMDECK_AGENT_GID:-10002}
      MODEMDECK_BEARER_STATE_FILE: /run/modemdeck/bearers.json
      MODEMDECK_NETWORK_STATE_FILE: /run/modemdeck/network.json
      MODEMDECK_RADIO_STATE_FILE: /run/modemdeck/radio-state.json
      MODEMDECK_MEDIA_BINDINGS_FILE: /etc/modemdeck/media-bindings.json
      MODEMDECK_MM_LOG_LEVEL: ${MODEMDECK_MM_LOG_LEVEL:-INFO}
    command:
      - --mode
      - simple
    volumes:
      - type: volume
        source: agent-runtime
        target: /run/modemdeck
        volume:
          nocopy: true
      - type: volume
        source: hardware-state
        target: /var/lib/ModemManager
        volume:
          nocopy: true
      - type: bind
        source: ${MODEMDECK_MEDIA_BINDINGS_FILE:-./hardware/config/media-bindings.empty.json}
        target: /etc/modemdeck/media-bindings.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /sys
        target: /sys
        bind:
          propagation: rslave
      - type: bind
        source: /run/udev
        target: /run/udev
        read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=32m,mode=0755
      - /run/dbus:rw,nosuid,nodev,noexec,size=4m,mode=0755
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/modemdeck-hardware-healthcheck
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    stop_grace_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${MODEMDECK_API_VERSION:-dev}
        BUILD_DATE: ${MODEMDECK_BUILD_DATE:-unknown}
        VCS_REF: ${MODEMDECK_VCS_REF:-unknown}
        MODEMDECK_UID: ${MODEMDECK_UID:-10001}
        MODEMDECK_GID: ${MODEMDECK_GID:-10001}
    image: ${MODEMDECK_IMAGE:-modemdeck}:${MODEMDECK_API_VERSION:-dev}
    container_name: modemdeck-api
    restart: unless-stopped
    init: true
    user: "${MODEMDECK_UID:-10001}:${MODEMDECK_GID:-10001}"
    group_add:
      - "${MODEMDECK_AGENT_GID:-10002}"
    depends_on:
      hardware:
        condition: service_healthy
        restart: true
    expose:
      - "8080"
    environment:
      MODEMDECK_LISTEN_ADDRESS: 0.0.0.0:8080
      MODEMDECK_DATABASE_PATH: /var/lib/modemdeck/modemdeck.db
      MODEMDECK_AGENT_SOCKET: /run/modemdeck/agent.sock
      MODEMDECK_TLS_DIRECTORY: /var/lib/modemdeck/tls
      MODEMDECK_TLS_HOSTS: ${MODEMDECK_TLS_HOSTS:-localhost,127.0.0.1,::1}
      MODEMDECK_SETTINGS_KEY_FILE: /run/secrets/modemdeck_settings_key
      MODEMDECK_SECURE_COOKIES: "true"
      MODEMDECK_HEALTHCHECK_URL: http://127.0.0.1:8080/api/v1/health/ready
      MODEMDECK_LIVENESS_URL: http://127.0.0.1:8080/api/v1/health/live
    secrets:
      - modemdeck_settings_key
    volumes:
      - type: bind
        source: ${MODEMDECK_DATA_DIR:-./data}
        target: /var/lib/modemdeck
        bind:
          create_host_path: false
      - type: volume
        source: agent-runtime
        target: /run/modemdeck
        read_only: true
        volume:
          nocopy: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 -O /dev/null "$${MODEMDECK_HEALTHCHECK_URL}" || exit 1
      interval: 20s
      timeout: 5s
      start_period: 25s
      retries: 4
    stop_grace_period: 20s

  modemdeck:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
      args:
        VERSION: ${MODEMDECK_WEB_VERSION:-dev}
        BUILD_DATE: ${MODEMDECK_BUILD_DATE:-unknown}
        VCS_REF: ${MODEMDECK_VCS_REF:-unknown}
    image: ${MODEMDECK_WEB_IMAGE:-modemdeck-web}:${MODEMDECK_WEB_VERSION:-dev}
    container_name: modemdeck
    restart: unless-stopped
    init: true
    user: "101:101"
    group_add:
      - "${MODEMDECK_GID:-10001}"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "${MODEMDECK_BIND_ADDRESS:-127.0.0.1}:${MODEMDECK_PORT:-7577}:7577"
    expose:
      - "7575"
      - "7576"
    environment:
      MODEMDECK_WEB_TLS_DIRECTORY: /var/lib/modemdeck/tls
    volumes:
      - type: bind
        source: ${MODEMDECK_DATA_DIR:-./data}/tls
        target: /var/lib/modemdeck/tls
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 3 -O /dev/null http://127.0.0.1:7575/api/v1/health/live || exit 1
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 4
    stop_grace_period: 10s

secrets:
  modemdeck_settings_key:
    file: ${MODEMDECK_SETTINGS_KEY_FILE:?MODEMDECK_SETTINGS_KEY_FILE must point to a host secret file}

volumes:
  agent-runtime:
    name: ${MODEMDECK_AGENT_RUNTIME_VOLUME:-modemdeck-agent-runtime}
  hardware-state:
    name: ${MODEMDECK_HARDWARE_STATE_VOLUME:-modemdeck-hardware-state}
