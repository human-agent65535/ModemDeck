worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    map $http_x_forwarded_proto $cloudflare_https_redirect {
        default 0;
        http 1;
    }

    # Cloudflare is the only public proxy in front of the origin listeners.
    # Normalize its original client address into an internal header; the API
    # validates the value before storing it in a session record.
    map $http_cf_connecting_ip $cloudflare_client_ip {
        default $http_cf_connecting_ip;
        '' $remote_addr;
    }

    # Login attempts are limited per client before Argon2 verification. Only
    # POST /api/v1/session gets a key; an empty key is not counted. Cloudflare
    # origin listeners key on the edge client address, the direct listener on
    # its TCP peer, so the API's global failure limit stays a backstop.
    map "$request_method:$uri:$cloudflare_client_ip" $cloudflare_login_limit_key {
        default "";
        "~^POST:/api/v1/session:(?<login_ip>.+)$" $login_ip;
    }
    map "$request_method:$uri:$remote_addr" $direct_login_limit_key {
        default "";
        "~^POST:/api/v1/session:(?<login_ip>.+)$" $login_ip;
    }
    limit_req_zone $cloudflare_login_limit_key zone=modemdeck_login_cloudflare:1m rate=10r/m;
    limit_req_zone $direct_login_limit_key zone=modemdeck_login_direct:1m rate=10r/m;
    limit_req_status 429;

    # Only the supported Upgrade value reaches the API. Ordinary API requests
    # keep an empty Connection header so upstream keep-alive still works.
    map $http_upgrade $websocket_upgrade {
        default '';
        ~*^websocket$ websocket;
    }
    map $websocket_upgrade $websocket_connection {
        default '';
        websocket upgrade;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream modemdeck_api {
        zone modemdeck_api 64k;
        server api:8080 resolve;
        keepalive 32;
    }

    server {
        include /tmp/modemdeck-origin-7575.conf;
        server_name _;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:CloudflareOriginTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 10m;

        if ($cloudflare_https_redirect) {
            return 308 https://$host$request_uri;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # No add_header here, so the server's security headers still apply.
        location @login_rate_limited {
            default_type application/json;
            return 429 '{"code":"login_rate_limited","message":"Too many failed login attempts; try again later"}';
        }

        location /api/ {
            limit_req zone=modemdeck_login_cloudflare burst=10 nodelay;
            error_page 429 = @login_rate_limited;
            proxy_pass http://modemdeck_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-ModemDeck-Client-IP $cloudflare_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $websocket_connection;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            return 404;
        }
    }

    server {
        include /tmp/modemdeck-origin-7576.conf;
        server_name _;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:CloudflareOriginTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;

        if ($cloudflare_https_redirect) {
            return 308 https://$host$request_uri;
        }

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self'; worker-src 'self'; connect-src 'self' wss://$http_host https://accounts.google.com/gsi/ https://people.googleapis.com; frame-src https://accounts.google.com/gsi/" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # No add_header here, so the server's security headers still apply.
        location @login_rate_limited {
            default_type application/json;
            return 429 '{"code":"login_rate_limited","message":"Too many failed login attempts; try again later"}';
        }

        location /api/ {
            limit_req zone=modemdeck_login_cloudflare burst=10 nodelay;
            error_page 429 = @login_rate_limited;
            proxy_pass http://modemdeck_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-ModemDeck-Client-IP $cloudflare_client_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $websocket_connection;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /index.html {
            try_files $uri =404;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }

    server {
        listen 7577 quic reuseport;
        listen 7577 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /tmp/modemdeck-web-cert.pem;
        ssl_certificate_key /tmp/modemdeck-web-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ModemDeckTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        error_page 497 =308 https://$http_host$request_uri;
        include /tmp/modemdeck-http3.conf;

        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self'; worker-src 'self'; connect-src 'self' wss://$http_host https://accounts.google.com/gsi/ https://people.googleapis.com; frame-src https://accounts.google.com/gsi/" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        # No add_header here, so the server's security headers still apply.
        location @login_rate_limited {
            default_type application/json;
            return 429 '{"code":"login_rate_limited","message":"Too many failed login attempts; try again later"}';
        }

        location /api/ {
            limit_req zone=modemdeck_login_direct burst=10 nodelay;
            error_page 429 = @login_rate_limited;
            proxy_pass http://modemdeck_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-ModemDeck-Client-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $websocket_upgrade;
            proxy_set_header Connection $websocket_connection;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }

        location = /index.html {
            try_files $uri =404;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
