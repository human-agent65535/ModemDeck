name: Checks

on:
  push:
    branches:
      - main
      - modemdeck
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to check
        required: true
        type: string

concurrency:
  group: checks-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      # Go, Web, Hardware, and deployment checks all run inside the pinned
      # Docker images owned by the Makefile, matching local verification.
      - name: Run make check
        run: make check

      - name: Scan history for secrets
        run: make secret-scan
