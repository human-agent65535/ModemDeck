name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private and one-off artifacts
        run: make repository-check

      - name: Scan complete history for secrets
        run: make secret-scan

  go:
    name: Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test and vet both Go modules
        run: make root-test root-vet agent-test agent-vet

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test, typecheck, lint, and build Web
        run: make web-check

  image:
    name: Container
    runs-on: ubuntu-latest
    needs:
      - go
      - web
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose
        env:
          COMPOSE_ADMIN_PASSWORD_FILE: /dev/null
          COMPOSE_SETTINGS_KEY_FILE: /dev/null
        run: make compose-config

      - name: Check Dockerfile
        run: make dockerfile-check

      - name: Build runtime image
        run: make image IMAGE=modemdeck VERSION=ci
